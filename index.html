<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="description" content="PFS Sales Training, Cohort 3: before and after results by phase, module and country.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-text">
      <h1 id="ttl">PFS Sales Training · Cohort 3 Impact Dashboard</h1>
      <p class="sub" id="sub">Partners in Food Solutions × Oo2 Formations &amp; Consulting</p>

    <div class="lang" role="group" aria-label="Language / Langue">
      <button type="button" id="lang-en" aria-pressed="true">EN</button>
      <button type="button" id="lang-fr" aria-pressed="false">FR</button>

  <main id="app" aria-live="polite"></main>
